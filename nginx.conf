server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compressão
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Cache para assets com hash no nome
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Caminhos antigos → 301 de verdade.
    # A landing já foi divulgada em /seja-representante, então esses links
    # existem em stories, prints e material impresso. O 301 preserva o valor de
    # SEO acumulado; o React Router repete as mesmas regras para cobrir dev e
    # preview, onde o nginx não roda.
    location = /seja-representante          { return 301 /; }
    location = /seja-representante/cadastro { return 301 /cadastro; }
    location = /seja-revendedora            { return 301 /; }

    # Fallback SPA — todas as rotas vão para index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
